      lore: "It speaks for the nothing beyond the stars."
      phase-1: "{name} <gray>tears the void open!"
      phase-2: "{name} <gray>brings the sky down!"



# A boss's fight, from its summoning to its fall. {name} is boss.name.
boss:
  name: "<red>☠ {name}</red>"
  # The boss bar each player near its arena sees, in their own language.
  bar: "☠ {name} · Lv{level}"
  subtitle: "<gray>Level {level}"
  ritual: "<gray>The sigil flares, and {name} <gray>stirs…"
  summoned: "<white>{player}</white> <gray>has summoned {name}<gray>!"
  defeated: "{name} <gray>has fallen to <white>{players}</white>!"
  defeated-alone: "{name} <gray>has fallen."
  departed: "{name} <gray>tires of waiting, and leaves."
  reward: "Your share of the spoils: {items}"
  reward-empty: "<gray>Your share of the spoils came to nothing this time."
  no-share: "<gray>You did not deal enough of the damage to earn a share of the spoils."
  refused:
    disabled: "Bosses cannot be summoned on this server."
    inactive: "Nothing answers a sigil in this world."
    town: "{name} will not be summoned inside a town."
    place: "{name} cannot be summoned here. Its sigil says where."
    crowded: "Another boss is too close to summon {name} here."
    room: "There is no room here for {name}."

