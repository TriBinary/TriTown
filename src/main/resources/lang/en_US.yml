# TriTown - English (en_US)
#
# Values are MiniMessage (https://docs.advntr.dev/minimessage/format.html). Keep every {placeholder}: TriTown fills
# them in. Keys missing here fall back to the bundled copy of this file, then to English.
# Run /tritown reload after editing.

command:
  usage: "Usage: /{command} <subcommand>"
  available: "Available sub-commands: {commands}"
  unknown: "Unknown sub-command: {command}"
  no-permission: "<red>You don't have permission to use this command!"

  # The help list is plain text: no MiniMessage tags.
  category:
    general: "General"
    economy: "Economy"
    info: "Info"
    moderation: "Moderation"
    shop: "Shops"
    trade: "Trading"
    admin: "Admin"
    menu: "Menu"
    news: "News"
    storage: "Storage"
    protection: "Protection"
    adventure: "Adventure"
    mobs: "Mobs"
    items: "Items"

  help:
    header: "TriTown Commands"
    description: "Show all available commands"

  menu:
    description: "Open the main menu"
    players-only: "<red>The main menu is a menu, so only players can open it."

  news:
    description: "Read the server's news"
    players-only: "<red>The news is read in a menu, so only players can open it."
    unavailable: "<red>The news is not available on this server right now."
    unknown: "<red>There is no such post."
    all-read: "Marked every post as read."
    usage: "<red>Usage: <white>/tritown news [open <id>|readall|manage]</white>"

  admin:
    description: "Open the admin panel"
    players-only: "<red>The admin panel is a menu, so only players can open it."
    unknown-section: "<red>There is no <white>{section}</white> section of the admin panel."
    no-permission-section: "<red>You don't have permission to open the <white>{section}</white> section!"
    unavailable: "<red>The admin panel is not available right now."

  reload:
    description: "Reload the plugin configuration and translations"
    done: "Configuration reloaded!"
    error: "<red>Error: Plugin instance type mismatch. Unable to reload configuration."

  balance:
    description: "Check your balance"
    yours: "Your balance: <white>{balance}</white>"
    founding-credit: "Founding credit: <white>{amount}</white> <gray>(only for founding a town with /t new)"
    other: "<white>{name}</white>: <white>{balance}</white>"
    console-needs-player: "<red>Specify a player: <white>/balance <player></white>"
    no-permission-others: "<red>You don't have permission to check another player's balance!"

  pay:
    description: "Pay another player"
    players-only: "<red>Only players can pay. Use <white>/eco give</white> from the console."
    usage: "<red>Usage: <white>/pay <player> <amount></white>"
    minimum: "<red>The smallest payment is <white>{amount}</white>."
    self: "<red>You cannot pay yourself."
    government: "<red>Use Towny's own deposit commands to pay a town or nation bank."
    server-account: "<red>You cannot pay the server account."
    no-account: "<red>Your account could not be opened."
    sent: "Paid <white>{amount}</white> to <white>{name}</white>. Balance: <white>{balance}</white>"
    received: "<white>{name}</white> paid you <white>{amount}</white>."

  baltop:
    description: "List the richest players"
    empty: "<gray>Nobody has any money yet."
    header: "<gold><bold>Richest accounts</bold></gold> <gray>(page {page}/{pages})"
    entry: "<gray>{rank}.</gray> <white>{name}</white>{tag} <dark_gray>-</dark_gray> <white>{balance}</white>"
    tag: " <gray>[{type}]</gray>"
    updated: "<dark_gray>Updated {age}."
    age:
      now: "just now"
      seconds: "{seconds} seconds ago"
      minute: "a minute ago"
      minutes: "{minutes} minutes ago"

  eco:
    description: "Administer player balances"
    no-permission-action: "<red>You don't have permission to use <white>/eco {action}</white>!"
    flushing: "Writing changed accounts to disk."
    target-usage: "<red>Usage: <white>/eco {action} <player></white>"
    amount-usage: "<red>Usage: <white>/eco {action} <player> <amount></white>"
    unknown-currency: "<red>Unknown currency <white>{currency}</white>."
    changed-by-admin: "<gray>Your balance was changed by an administrator."
    gave: "Gave <white>{amount}</white> to <white>{name}</white>. Balance: <white>{balance}</white>"
    took: "Took <white>{amount}</white> from <white>{name}</white>. Balance: <white>{balance}</white>"
    set: "Set <white>{name}</white> to <white>{amount}</white>. Balance: <white>{balance}</white>"
    reset: "Reset <white>{name}</white> to <white>{balance}</white>"
    info:
      header: "<gold><bold>{name}</bold></gold>"
      uuid: "<gray>UUID:</gray> <white>{uuid}</white>"
      type: "<gray>Type:</gray> <white>{type}</white>"
      created: "<gray>Created:</gray> <white>{date}</white>"
      updated: "<gray>Updated:</gray> <white>{date}</white>"
      balance: "<gray>{currency}:</gray> <white>{balance}</white>"
    history:
      players-only: "<red>Only players can open the history view."
      no-permission-others: "<red>You don't have permission to view another account's history!"
      unavailable: "<red>The history view is unavailable."
    usage:
      header: "<gold><bold>Economy administration</bold></gold>"
      give: "<white>/eco give <player> <amount> [currency]</white> <gray>- add money"
      take: "<white>/eco take <player> <amount> [currency]</white> <gray>- remove money"
      set: "<white>/eco set <player> <amount> [currency]</white> <gray>- set a balance outright"
      reset: "<white>/eco reset <player></white> <gray>- back to the starting balance"
      info: "<white>/eco info <player></white> <gray>- account details"
      history: "<white>/eco history [player]</white> <gray>- browse recorded transactions"
      flush: "<white>/eco flush</white> <gray>- write changed accounts to disk now"

  scoreboard:
    description: "Show or hide the sidebar"
    players-only: "<red>Only players have a sidebar."
    unavailable: "<red>The sidebar is switched off on this server."
    usage: "<red>Usage: <white>/tritown scoreboard [on|off]</white>"
    shown: "Sidebar shown."
    hidden: "Sidebar hidden."
    pinned: "Sidebar pinned to the <white>{board}</white> board."
    unpinned: "Sidebar back to matching where you stand."
    unknown-board: "<red>No board named <white>{board}</white>."

  storage:
    description: "Open your storage"
    players-only: "<red>Your storage is a menu, so only players can open it."
    usage: "<red>Usage: <white>/tritown storage [view <player>|pages <player> <add|set> <amount>]</white>"
    not-found: "No player called {name} has played here."
    pages-set: "<white>{name}</white> now has <white>{amount}</white> storage pages."

  protection:
    description: "See or clear who owns a container or entity"
    players-only: "<red>Look at a container or entity in game to use this."
    usage: "<red>Usage: <white>/tritown protection <inspect|release></white>"
    no-target: "Look at a container, item frame, armor stand or mob first."
    public: "<gray>Nobody owns that: anyone can use it."
    owner: "That belongs to <white>{name}</white>."
    released: "Released <white>{name}</white>'s claim. Anyone can use it now."

  stats:
    description: "See your combat stats"
    players-only: "<red>Stats are shown in a menu, so only players can open them."
    unavailable: "<red>Combat stats are switched off in this world."
    not-found: "<red><white>{name}</white> is not online."

  mob:
    description: "Inspect mob levels and the combat balance"
    usage: "<red>Usage: <white>/tritown mob <level|balance|kinds|spawn <kind> [level]></white>"
    players-only: "<red>Stand somewhere in game to read its level."
    inactive: "<red>Mobs are not levelled in this world."
    level: "Mobs spawning here are level <white>{level}</white>."
    level-town: "<gray> · Town claims are always level 1."
    level-hub: "<gray> · This is the spawn area, which stays at its base level."
    level-ring: "<gray> · Ring <white>{ring}</white> out from spawn."
    level-night: "<gray> · It is night, which adds to it."
    level-deep: "<gray> · Below Y 0, which adds to it."
    balance-header: "A zombie at each level, against a full kit of rare ★★★ gear of the tier made for it:"
    balance-row: "<gray>Lv <white>{level}</white> <dark_gray>(tier {tier})</dark_gray>: <red>{health}❤</red>, hits for <red>{hit}</red> · dies in <white>{hits}</white> swings · each hit takes <white>{percent}%</white> of health"
    kinds: "<white>{amount}</white> custom mobs: <gray>{ids}"
    unknown-kind: "<red>There is no custom mob <white>{id}</white>. <gray>/tritown mob kinds</gray> names them all."
    spawned: "Called up a <white>{name}</white> at level <white>{level}</white>. It drops nothing beyond vanilla's loot."
    bosses-header: "Each boss at its level, against one player in a full kit of rare ★★★ gear of its tier:"
    bosses-row: "<gray>{name} <dark_gray>(Lv {level}, tier {tier})</dark_gray>: <red>{health}❤</red>, hits for <red>{hit}</red> · alone, <white>{hits}</white> swings · each hit takes <white>{percent}%</white> of health"

  item:
    description: "Give out the server's own items"
    usage: "<red>Usage: <white>/tritown item <give <player> <id> [amount]|list></white>"
    not-found: "<red><white>{name}</white> is not online."
    unknown: "<red>There is no item <white>{id}</white>. <gray>/tritown item list</gray> names them all."
    given: "Gave <white>{amount}x {id}</white> to <white>{name}</white>."
    list: "<white>{amount}</white> items: <gray>{ids}"

  bestiary:
    description: "See the server's own mobs you have met"
    players-only: "<red>The bestiary is a menu, so only players can open it."

  forge:
    description: "Craft and improve gear"
    players-only: "<red>The Forge is a menu, so only players can open it."
    unavailable: "<red>The Forge is closed in this world."

  trades:
    description: "Open the server's global shop"
    players-only: "<red>A shop is a menu, so only players can open it."
    disabled: "<red>Shops are switched off on this server."
    unavailable: "<red>The global shop is not available right now."

  trade:
    description: "Ask another player to trade"
    players-only: "<red>Trading happens in a menu, so only players can do it."
    disabled: "<red>Player trading is switched off on this server."
    usage: "<red>Usage: <white>/trade <player></white>"
    self: "<red>You cannot trade with yourself."
    not-found: "<red><white>{name}</white> is not online."
    busy: "<red><white>{name}</white> is already trading with somebody."
    you-busy: "<red>You are already trading."
    too-far: "<red>You have to be standing next to each other to trade."
    sent: "Asked <white>{name}</white> to trade. They have <white>{seconds}s</white> to answer."
    received: "<white>{name}</white> wants to trade with you. <click:run_command:'/trade accept {name}'><green><bold>[Accept]</bold></green></click> <click:run_command:'/trade deny {name}'><red><bold>[Deny]</bold></red></click>"
    expired: "<gray>Your trade request to <white>{name}</white> lapsed."
    no-requests: "<red>Nobody has asked you to trade."
    no-request: "<red><white>{name}</white> has not asked you to trade."
    which-request: "<red>More than one player has asked. Say which: <white>{names}</white>"
    denied: "Turned down the trade request from <white>{name}</white>."
    denied-by: "<white>{name}</white> turned down your trade request."

  shop:
    description: "Administer the server's shops"
    disabled: "<red>Shops are switched off on this server."
    unavailable: "<red>Shops could not be loaded. Check the server log."
    no-permission-action: "<red>You don't have permission to use <white>/tritown shop {action}</white>."
    players-only: "<red>Only a player can open a menu."
    unknown: "<red>There is no shop with the id <white>{id}</white>."
    created: "Created the shop <white>{id}</white>."
    create-failed: "<red><white>{id}</white> is taken or is not a usable id. Use lowercase letters, digits, dashes and underscores."
    delete-confirm: "<red>Deleting a shop cannot be undone. Run <white>/tritown shop delete {id} confirm</white> to go ahead."
    delete-global: "<red><white>{id}</white> is the shop <white>/trades</white> opens and cannot be deleted. Empty it in the editor instead, or point <white>shops.global-id</white> elsewhere."
    deleted: "Deleted the shop <white>{id}</white>."
    opened: "Opened <white>{id}</white> for <white>{player}</white>."
    bound: "<white>{npc}</white> now opens the shop <white>{id}</white>."
    unbound: "<white>{npc}</white> no longer opens the shop <white>{id}</white>."
    npc-unknown: "<red>There is no NPC named <white>{npc}</white>."
    npc-not-bound: "<red><white>{npc}</white> does not open a shop."
    npcs-unavailable: "<red>{plugin} is not installed, so NPCs cannot be bound."
    usage:
      header: "<gold><bold>Shop administration</bold></gold>"
      list: "<white>/tritown shop list</white> <gray>- every shop on the server"
      create: "<white>/tritown shop create <id> [name]</white> <gray>- start a new shop"
      delete: "<white>/tritown shop delete <id> confirm</white> <gray>- remove a shop for good"
      edit: "<white>/tritown shop edit <id></white> <gray>- change what a shop offers"
      open: "<white>/tritown shop open <id> [player]</white> <gray>- open a shop for somebody"
      bind: "<white>/tritown shop bind <id> <npc></white> <gray>- put an NPC behind the counter"
      unbind: "<white>/tritown shop unbind <npc></white> <gray>- take an NPC off its shop"
      stats: "<white>/tritown shop stats <id></white> <gray>- what a shop has traded"


# The item in the last hotbar slot that opens the main menu.
menu-item:
  name: "<gradient:yellow:gold><bold>TriTown Menu</bold></gradient>"
  lore: "<gray>Right-click to open the menu.<newline><dark_gray>It stays in this slot and cannot be dropped, moved or stored."
  relocated: "<gray>The TriTown menu lives in your last hotbar slot, so what was there has moved into your inventory."
  dropped: "<gray>The TriTown menu lives in your last hotbar slot, and your inventory was full, so what was there was dropped at your feet."
  unread: "<gold>✉ {amount} unread server updates"

founding-credit:
  granted: "You have a <white>{amount}</white> founding credit. It pays towards your first town when you found one with <white>/t new</white>, and nothing else can spend it. Joining someone else's town gives it up."
  applied: "Your founding credit covers <white>{amount}</white> of the cost of your town."
  forfeited: "<gray>You joined a town, so your founding credit has been given up."

# The server's news: update notes written in game and read from the main menu.
news:
  # One entry as a line: its tag, then what it says.
  entry: "{tag} <gray>{text}"
  tag:
    new: "<green>✚ New</green>"
    changed: "<gold>✎ Changed</gold>"
    fixed: "<dark_aqua>✔ Fixed</dark_aqua>"
    removed: "<red>✖ Removed</red>"
    note: "<gray>✦ Note</gray>"
  join:
    header: "<gold>✉</gold> You have <white>{amount}</white> unread server updates:"
    entry: " <dark_gray>•</dark_gray> <click:run_command:'/tritown news open {id}'><white>{title}</white> <yellow>[Read]</yellow></click>"
    more: " <dark_gray>…and {amount} more."
    open: " <click:run_command:'/tritown news'><gold><bold>[Open the news]</bold></gold></click>"
  broadcast:
    title: "<gold><bold>Server Update</bold></gold>"
    chat: "<gold>✉ New server update:</gold> <white>{title}</white> <click:run_command:'/tritown news open {id}'><yellow><bold>[Read]</bold></yellow></click>"
  # The post as a written book. Book pages are light, so dark colours read best.
  book:
    title: "<bold>{title}</bold>"
    label: "<dark_gray>{label}"
    date: "<dark_gray>{date}"
    summary: "{text}"
    category: "<bold><underlined>{name}</underlined></bold>"
    entry: "{tag} <black>{text}"
  editor:
    created: "Draft created. Add categories, then publish it when it is ready."
    deleted: "Post deleted."
    published: "Post published."
    unpublished: "Post taken back to drafts. Players can no longer see it."
    publish-empty: "<red>A post needs at least one entry before it can be published."
    category-removed: "Category removed."
    entry-added: "Added: {entry}"
    entry-removed: "Entry removed."
    too-long: "<red>That is too long. Keep it to <white>{amount}</white> characters."

common:
  unknown: "unknown"
  invalid-amount: "<red>That is not a valid amount."
  economy-unavailable: "<red>The economy is not available on this server."
  no-account: "<red>No account found for <white>{name}</white>."
  # Wraps a money.error.* line, which is plain so other plugins can print it.
  error: "<red>{message}"
  duration: "{hours}h {minutes}m"
  "on": "On"
  "off": "Off"
  # Shown by a sidebar marker whose value does not exist, such as the town of a
  # player who has none.
  none: "-"

  prompt-cancel: "<dark_gray>Type <white>cancel</white> to leave it as it is."
  prompt-cancelled: "<gray>Left unchanged."

money:
  # Plain text only: these also travel to other plugins as Vault's error message, which they print verbatim.
  error:
    negative-amount: "Amount cannot be negative"
    too-large: "That amount is too large to hold"
    balance-cap: "Balance cap reached"
    recipient-balance-cap: "The recipient has reached the balance cap"
    insufficient-funds: "Insufficient funds"
    negative-balance: "Balance cannot be negative"
    same-account: "Cannot transfer to the same account"
    unavailable: "The economy is not available"
    no-account: "That account does not exist"
    unusable-amount: "Amount is not a usable number"
    account-not-created: "That account could not be created"
    no-banks: "TriTown does not provide Vault bank accounts"

  # Why a transaction happened, as shown in the history view. These are also written to the transaction
  # log as keys, so a record stays readable whichever language the server is later set to.
  reason:
    external: "External plugin"
    starting-balance: "Starting balance"
    payment: "Player payment"
    towny: "Towny"
    town-deleted: "{name} was deleted"
    admin-set: "Set by {admin}"
    admin-reset: "Reset by {admin}"
    shop-buy: "Bought at {shop}"
    shop-sell: "Sold at {shop}"
    trade: "Player trade"
    storage-page: "Storage page {page}"
    gear-craft: "Forged {item}"
    gear-upgrade: "Upgraded {item}"
    gear-refine: "Refined {item}"
    gear-reforge: "Reforged {item}"

  # Where money comes from and where it goes, as the admin panel groups it.
  flow:
    starting-balance: "New players"
    shop: "Shops"
    storage: "Storage pages"
    gear: "The Forge"
    towny: "Towny"
    admin: "Administration"
    payment: "Player payments"
    external: "Other plugins"
    other: "Uncategorised"

  # What asked for the transaction. A source TriTown does not know is shown as it was recorded.
  source:
    vault: "Another plugin"
    command: "TriTown command"
    towny: "Towny"
    shop: "Shop"
    storage: "Storage"
    gear: "The Forge"

  account-type:
    player: "player"
    town: "town"
    nation: "nation"
    npc: "npc"
    server: "server"
    unknown: "unknown"

  transaction:
    deposit: "Received"
    withdraw: "Paid out"
    transfer-in: "Payment in"
    transfer-out: "Payment out"
    set: "Balance set"
    closed: "Account closed"

gui:
  previous-page: "<yellow>Previous Page"
  next-page: "<yellow>Next Page"
  page: "<white>Page {page}/{pages}"

  # The main menu, opened from the menu item or with /tritown menu.
  menu:
    title: "<dark_gray>TriTown"
    back: "<yellow>Back"
    back-lore: "<gray>Return to the main menu."
    close: "<red>Close"
    profile: "<gold><bold>{name}</bold></gold>"
    profile-balance: "<gray>Balance: <gold>{balance}</gold>"
    profile-credit: "<gray>Founding credit: <white>{amount}</white>"
    profile-rank: "<gray>Leaderboard: <white>#{rank}</white>"
    profile-town: "<gray>Town: <white>{town}</white>"
    profile-nation: "<gray>Nation: <white>{nation}</white>"
    profile-stats: "<yellow>Click <gray>to see your combat stats"
    forge: "<gold><bold>Forge</bold></gold>"
    forge-lore: "<gray>Craft gear from what mobs drop, and make it stronger."
    bestiary: "<dark_aqua><bold>Bestiary</bold></dark_aqua>"
    bestiary-lore: "<gray>Every one of the server's own mobs you have slain, and what each gave you."
    bestiary-found: "<gray>Found: <white>{found}</white>/<white>{total}"
    town: "<green><bold>Town</bold></green>"
    town-name: "<gray>Town: <white>{town}</white>"
    town-residents: "<gray>Residents: <white>{amount}</white>"
    town-bank: "<gray>Bank: <gold>{amount}</gold>"
    town-upkeep: "<gray>Upkeep: <white>{amount}</white>"
    town-none: "<gray>You are not in a town yet. Browse the towns to join one, or found your own."
    town-credit: "<gray>Your <white>{amount}</white> founding credit pays towards the first town you found."
    town-open: "<yellow>Click <gray>to open TownyMenu"
    shop: "<green><bold>Global Shop</bold></green>"
    shop-lore: "<gray>Buy from the server and sell back to it, wherever you are standing."
    storage: "<light_purple><bold>Storage</bold></light_purple>"
    storage-lore: "<gray>Your own storage, open from anywhere. Vanilla chests can only be emptied now."
    storage-pages: "<gray>Pages: <white>{amount}</white><dark_gray>/{max}"
    storage-next: "<gray>Next page: <gold>{amount}</gold>"
    trade: "<aqua><bold>Trade</bold></aqua>"
    trade-lore: "<gray>Swap items and money with a player standing near you. Shift-right-clicking them works too."
    trade-waiting: "<yellow>{amount} waiting for your answer"
    pay: "<gold><bold>Pay</bold></gold>"
    pay-lore: "<gray>Send money to another player who is online."
    leaderboard: "<gold><bold>Leaderboard</bold></gold>"
    leaderboard-lore: "<gray>The richest players on the server."
    leaderboard-entry: "<gray>#{rank} <white>{name}</white> <dark_gray>-</dark_gray> <gold>{balance}</gold>"
    server: "<aqua><bold>Server</bold></aqua>"
    sidebar: "<yellow><bold>Sidebar</bold></yellow>"
    sidebar-on: "<gray>The sidebar is <green>shown</green>."
    sidebar-off: "<gray>The sidebar is <red>hidden</red>."
    sidebar-hide: "<yellow>Click <gray>to hide it"
    sidebar-show: "<yellow>Click <gray>to show it"
    admin: "<red><bold>Admin Panel</bold></red>"
    admin-lore: "<gray>Read the server's economy and shops."
    news: "<gold><bold>News</bold></gold>"
    news-lore: "<gray>What has changed on the server lately."
    news-unread: "<yellow>{amount} unread"
    news-entry: "<dark_gray>• <white>{title}"

  menu-leaderboard:
    title: "<dark_gray>Leaderboard"
    first: "<gold><bold>#{rank}</bold></gold> <white>{name}</white>"
    second: "<#d7dde4><bold>#{rank}</bold></#d7dde4> <white>{name}</white>"
    third: "<#cd7f32><bold>#{rank}</bold></#cd7f32> <white>{name}</white>"
    entry: "<yellow>#{rank}</yellow> <white>{name}</white>"
    balance: "<gray>Balance: <gold>{balance}</gold>"
    account: "<dark_gray>A {type} bank"
    you: "<green>That's you!"
    empty: "<gray>Nobody is on the leaderboard yet"
    your-rank: "<gold><bold>Your Rank</bold></gold>"
    ranked: "<gray>You are <white>#{rank}</white> with <gold>{balance}</gold>."
    unranked: "<gray>You are not on the leaderboard yet."

  menu-players:
    title-trade: "<dark_gray>Trade with…"
    title-pay: "<dark_gray>Pay…"
    name: "<yellow>{name}"
    request: "<green>Wants to trade with you.<newline><yellow>Click <gray>to accept"
    distance: "<gray>{amount} blocks away"
    ask: "<yellow>Click <gray>to ask them to trade"
    pay: "<yellow>Click <gray>to choose how much to pay"
    pay-prompt: "<gray>How much do you want to pay <white>{name}</white>? You have <gold>{balance}</gold>."
    nobody-near: "<gray>Nobody is close enough to trade"
    nobody-near-lore: "<gray>Stand within <white>{amount}</white> blocks of another player to trade with them."
    nobody-online: "<gray>Nobody else is online"
    gone: "That player is no longer online."
    refresh: "<aqua>Refresh"
    refresh-lore: "<gray>Look again for players, since people move about."

  # The admin panel. Amounts, counts and percentages are filled in by TriTown.
  admin:
    title: "<dark_gray>Admin panel"
    economy: "<gold><bold>Economy</bold></gold>"
    economy-lore: "<gray>Supply, faucets, sinks and who holds what."
    economy-supply: "<gray>In existence: <white>{amount}</white>"
    economy-net: "<gray>Net over {window}: {amount}"
    economy-accounts: "<gray>Accounts: <white>{amount}</white>"
    economy-stats-off: "<red>Statistics are switched off in config.yml."
    shops: "<green><bold>Shops</bold></green>"
    shops-lore: "<gray>What every shop has traded."
    shops-count: "<gray>Shops: <white>{amount}</white>"
    shops-taken: "<gray>Taken in: <gold>{amount}</gold>"
    shops-paid: "<gray>Paid out: <green>{amount}</green>"
