# TriTown - Gear
#
# Every piece of gear the Forge crafts and champions drop, and the reforges it can be given. /tritown reload reads this
# file again, and every piece already out there is redrawn the next time someone looks at it.
#
# A piece never lists its stats. It has a slot and a tier, which give it points to spend (balance.yml), and weights,
# which say how it spends them. So two pieces of a slot and tier are always worth the same, however each is shaped.
#
#   slot     weapon, bow, helmet, chestplate, leggings or boots
#   tier     1 to 10: a tier is made for mobs up to six times its level, so tier 5 is for level 25 to 30
#   base     the vanilla item it is made of. Between players the piece is exactly that item, enchantments and all
#   model    optional: a vanilla item whose look it takes instead of its base's
#   trim     optional, for armor: an armor trim's pattern and material
#   dye      optional, for leather: a colour such as '#3a5f8c'
#   weights  how its points are shared between stats. They are scaled to add up, so 60 and 40 mean the same as 3 and 2
#   recipe   what the Forge takes to craft it: items from items.yml, and money. A piece with none only ever drops
#
# The stats are health, defense, damage, strength, crit-chance, crit-damage, speed, vitality and magic-find. A piece's
# name and description are gear.item.<id>.name and gear.item.<id>.lore in the language files.
#
# An id is lower-case letters, digits and dashes, and must never change once players hold the piece.
gear:
  gravewalker-blade:
    slot: weapon
    tier: 1
    base: iron_sword
    weights: {damage: 60, strength: 40}
    recipe:
