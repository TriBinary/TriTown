# A reforge is a small named extra the Forge can give a piece: worth reforge-share percent of its points (balance.yml),
# spent by the reforge's own weights, on the slots it fits. Its name goes before the piece's, and is
# gear.reforge.<id> in the language files.
reforges:
  sharp:
    slots: [ weapon, bow ]
    weights: { crit-chance: 50, crit-damage: 50 }
  heroic:
    slots: [ weapon ]
    weights: { strength: 70, damage: 30 }
  fierce:
    slots: [ weapon, bow ]
    weights: { strength: 50, crit-damage: 50 }
  deadly:
    slots: [ bow ]
    weights: { damage: 60, crit-chance: 40 }
  titanic:
    slots: [ helmet, chestplate, leggings, boots ]
    weights: { health: 70, defense: 30 }
  sturdy:
    slots: [ helmet, chestplate, leggings, boots ]
    weights: { defense: 100 }
  hardy:
    slots: [ helmet, chestplate, leggings, boots ]
    weights: { vitality: 50, health: 50 }
  swift:
    slots: [ leggings, boots ]
    weights: { speed: 100 }
  lucky:
    slots: [ weapon, bow, helmet ]
    weights: { magic-find: 100 }
