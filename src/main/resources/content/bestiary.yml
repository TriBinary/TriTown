# TriTown - Bestiary
#
# The server's own mobs. /tritown reload reads this file again, and a change reaches every one already out there: a
# custom mob only remembers which one it is. Turn them off with mobs.custom.enabled in config.yml.
#
# A variant is a vanilla kind of mob with a name, a look and loot of its own. Now and then one takes the place of a wild
# spawn of its kind: only a mob that spawned in the wild, so never one in a town, from a spawner, an egg or a command.
#
#   base       the vanilla kind it is, such as zombie. It only ever takes the place of a spawn of that kind
#   spawn      where it lives, and how often it appears there:
#                worlds    kinds of world (normal, nether, the_end) or world names; left out for any
#                biomes    biomes such as desert or minecraft:swamp; left out for any
#                levels    [lowest, highest] level it spawns at
#                time      any, day or night (the Overworld's)
#                min-y     the lowest height it spawns at, and max-y the highest; left out for any
#                chance    percent of the wild spawns of its kind that fit all of the above and become it. Each variant
#                          of a kind rolls in the order this file lists them, and the first to succeed takes the spawn
#   rankable   whether it may still spawn as an elite or a champion; true when left out
#   health     what it multiplies the health its level gives its kind by; 1 when left out
#   damage     what it multiplies its hits by; 1 when left out
#   defense    Defense it has, as a player's armor works against mobs: 100 halves each hit
#   speed      percent faster it moves; below 0 is slower
#   scale      its size, where 1 is its kind's. It is bigger to hit, too
#   knockback  percent of knockback it shrugs off, up to 100
#   affixes    affixes it always has (see balance.yml), on top of any its rank rolls
#   equipment  what it wears and holds, by slot (head, chest, legs, feet, hand, off-hand): gear:<id> for a piece of gear's
#              look, or a vanilla item such as golden_helmet. Only ever a look: it gives the mob no armor or damage and
#              never drops. Illagers, witches, spiders and endermen show none of it
#   loot       what it drops on top of its family's material (mobs.yml) and its rank's essence, each line rolled on its
#              own, chance percent of the time, with the killer's Magic Find:
#                {item: <id>, chance: 25, amount: [1, 2]}    an item from items.yml
#                {gear: <id>, chance: 0.5}                   a piece of gear, at a rarity from drop-odds in balance.yml
#
# Its drops follow the same rules as every wild mob's (mobs.yml): players must have dealt enough of its damage. Its name
# and description are mob.kind.<id>.name and mob.kind.<id>.lore in the language files. An id is lower-case letters,
# digits and dashes, and must never change once the mob is out there.
variants:
  # ── The Overworld ─────────────────────────────────────────────────────────────────────────────────────────────────
  gravewalker:
    base: zombie
    spawn: {worlds: [normal], levels: [3, 14], chance: 6}
    health: 1.8
    damage: 1.2
    defense: 40
    scale: 1.05
    knockback: 20
    equipment:
      head: gear:gravewalker-helmet
      chest: gear:gravewalker-chestplate
      feet: gear:gravewalker-boots
      hand: gear:gravewalker-blade
    loot:
      - {item: grave-dust, chance: 25, amount: [1, 2]}
      - {gear: gravewalker-blade, chance: 0.5}

  crypt-ghoul:
