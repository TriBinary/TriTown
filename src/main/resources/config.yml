# TriTown Configuration

# A friendly prefix shown before plugin messages
message-prefix: "<click:run_command:/tritown help><gradient:yellow:gold>[TriTown]"

# ── Economy ─────────────────────────────────────────────────────────────────
economy:
  # Turn the economy off entirely. TriTown then needs another plugin to supply one.
  enabled: true

  provider:
    # Who supplies the server's Vault economy.
    #   internal - TriTown always supplies it, at the highest priority
    #   external - TriTown never supplies it and uses another plugin's instead
    #   auto     - TriTown supplies it unless one of the plugins below is installed
    # Changing this needs a restart: TriTown has to register with Vault before
    # Towny starts up, which happens before any plugin can be reloaded.
    mode: auto
    # Checked by plugin name. An economy plugin not listed here still wins, because
    # "auto" registers at a low service priority.
    defer-to:
      - Essentials
      - EssentialsX
      - CMI
      - XConomy
      - GemsEconomy
      - iConomy
      - BOSEconomy
      - EconomyAPI

  currency:
    # Stable key used in storage and commands. Never shown to players.
    id: dollar
    singular: Dollar
    plural: Dollars
    symbol: "$"
    # Digits kept after the decimal point. Balances are stored as whole units of the
    # smallest denomination, so changing this once accounts exist stops the plugin
    # unless storage.allow-rescale is turned on.
    fractional-digits: 2
    # Plain text only. Other plugins print this verbatim, so no MiniMessage tags here.
    # Placeholders: %symbol%, %amount%, %currency%
    format: "%symbol%%amount%"
    # Used for TriTown's own messages. MiniMessage, same placeholders.
    rich-format: "<gold>%symbol%%amount%</gold>"

  # Balance granted to a player the first time they join.
  starting-balance: 100.0
  # Largest balance an account may hold. Set to 0 to remove the cap.
  # A payment that would break the cap fails rather than being trimmed to fit.
  balance-cap: 1000000000.0
  # Smallest amount /pay will accept.
  minimum-payment: 0.01
  # Whether a withdrawal may take an account below zero.
  allow-negative-balances: false

  commands:
    # Register /balance, /pay and /baltop as commands of their own. When false they are
    # only reachable as /tritown balance, /tritown pay and so on. Needs a restart.
    # Another plugin that already owns one of these names keeps it either way; TriTown's
    # version stays reachable as /tritown:balance.
    top-level-aliases: true
    # Entries per page of /baltop.
    baltop-size: 10
    # List town and nation banks alongside players. Off by default, because Towny already
    # shows those and caches them, so the two lists would disagree.
    baltop-include-towns: false

  storage:
    # Where balances are kept. Only "json" ships today.
    type: json
    # Seconds between writing changed accounts to disk. A crash loses at most this long.
    flush-interval: 60
    # Convert every balance when fractional-digits changes, instead of refusing to start.
    allow-rescale: false

  towny:
    # Remove a town's or nation's account when Towny deletes it. When false the account is
    # emptied but kept, so it can still be audited.
    delete-accounts-on-delete: true

  history:
    # Record every transaction to <plugin folder>/economy/transactions.log.
    enabled: true
    # How many recent entries each account keeps in memory for /eco history.
    # Only accounts that have been active since the last restart use any memory.
    max-entries-per-account: 100
    # How long rolled log files are kept. 0 keeps them forever.
    retention-days: 30
    # Size at which the log is rolled aside into a dated file.
    roll-size-mb: 16
    time-format: "yyyy-MM-dd HH:mm"
