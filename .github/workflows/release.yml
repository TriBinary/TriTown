# Creates a GitHub Release when a new plugin_version lands on master.
# The tag (v<plugin_version>) is created by the release itself, so releases
# are published in the repository the commit is merged into, not in the fork
# the pull request came from. Forks never release. The release body is the
# matching section from CHANGELOG.md and the built plugin jar is attached.

name: release
on:
  push:
    branches:
      - master
    paths:
      - gradle.properties
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: release
  cancel-in-progress: false

jobs:
  release:
    if: ${{ !github.event.repository.fork }}
    runs-on: ubuntu-24.04
    steps:
      - name: checkout repository
        uses: actions/checkout@v6
      - name: read plugin version
        id: version
        run: |
          VERSION="$(sed -n 's/^plugin_version=//p' gradle.properties | tr -d '[:space:]')"
          if [ -z "$VERSION" ]; then
            echo "::error::plugin_version is missing from gradle.properties"
            exit 1
          fi
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          if git ls-remote --exit-code --tags origin "refs/tags/v$VERSION" > /dev/null; then
            echo "Release v$VERSION already exists, nothing to do."
            echo "exists=true" >> "$GITHUB_OUTPUT"
          else
            echo "exists=false" >> "$GITHUB_OUTPUT"
          fi
      - name: extract changelog section
        if: steps.version.outputs.exists == 'false'
        env:
          VERSION: ${{ steps.version.outputs.version }}
        run: |
          awk -v ver="$VERSION" '
            $0 == "## Version " ver { found = 1; next }
            found && /^## / { exit }
            found { print }
          ' CHANGELOG.md > RELEASE_NOTES.md
          if ! grep -q '[^[:space:]]' RELEASE_NOTES.md; then
            echo "::error::No changelog section found for version $VERSION in CHANGELOG.md"
            exit 1
          fi
      - name: setup jdk
        if: steps.version.outputs.exists == 'false'
        uses: actions/setup-java@v5
        with:
          java-version: '25'
          distribution: 'microsoft'
      - name: make gradle wrapper executable
        if: steps.version.outputs.exists == 'false'
        run: chmod +x ./gradlew
      - name: build
        if: steps.version.outputs.exists == 'false'
        run: ./gradlew build
      - name: create release
        if: steps.version.outputs.exists == 'false'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v${{ steps.version.outputs.version }}
          target_commitish: ${{ github.sha }}
          name: v${{ steps.version.outputs.version }}
          body_path: RELEASE_NOTES.md
          files: build/libs/*.jar
